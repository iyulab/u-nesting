<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-Nesting Demo — 2D/3D Spatial Optimization (WASM)</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>U-Nesting <span class="badge">WASM</span></h1>
      <span class="ver" id="version">v…</span>
    </div>
    <nav class="modes">
      <button class="mode active" data-mode="2d">2D Nesting</button>
      <button class="mode" data-mode="3d">3D Bin Packing</button>
      <button class="mode" data-mode="cutting">Cutting Path</button>
    </nav>
    <div class="links">
      <a href="https://github.com/iyulab/U-Nesting" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/@iyulab/u-nesting" target="_blank" rel="noopener">npm</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="panel-block">
        <div class="block-title">Preset</div>
        <select id="preset"></select>
      </section>

      <section class="panel-block">
        <div class="block-title">Strategy</div>
        <select id="strategy"></select>
      </section>

      <section class="panel-block">
        <div class="block-title">Parameters</div>
        <div id="controls"></div>
      </section>

      <section class="panel-block">
        <div class="block-title">Parts</div>
        <div id="parts" class="parts"></div>
        <div class="parts-actions">
          <label class="btn-file">Load JSON<input type="file" id="loadJson" accept=".json" hidden /></label>
        </div>
      </section>

      <button id="run" class="run-btn">Run</button>
    </aside>

    <main class="stage">
      <div class="stage-hint" id="hint">Scroll to zoom · drag to pan</div>
      <canvas id="canvas2d" width="900" height="620"></canvas>
      <canvas id="canvas3d" width="900" height="620" hidden></canvas>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="sheet-tabs" id="sheetTabs"></div>
    </main>

    <aside class="results">
      <section class="panel-block">
        <div class="block-title">Result</div>
        <div id="metrics" class="metrics">Run to see results.</div>
        <div id="utilbar" class="utilbar" hidden><span></span></div>
      </section>
      <section class="panel-block">
        <div class="block-title">Legend</div>
        <div id="legend" class="legend"></div>
      </section>
      <section class="panel-block">
        <div class="block-title">Export</div>
        <div class="export-actions">
          <button id="exportJson" class="btn">JSON</button>
          <button id="exportPng" class="btn">PNG</button>
        </div>
      </section>
    </aside>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
