# Dependency version updates.
#
# Grouped and monthly on purpose: ungrouped weekly updates produce more pull
# requests than a small maintainer team reviews, and an unreviewed dependency
# pull request is worse than no automation at all.
#
# The github-actions ecosystem is the one that keeps pinned action SHAs fresh.
# A SHA pin without it is a snapshot that silently goes stale.
version: 2
updates:
  # GitHub Actions requires "/" — Dependabot reads .github/workflows from the root.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch land together. Majors stay separate: a breaking
      # migration is a dedicated piece of work, not a routine bump.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The C# binding and its contract tests (bindings/csharp). Without this entry
  # the test stack stayed on the versions it was created with.
  - package-ecosystem: nuget
    directories:
      - /bindings/csharp/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
