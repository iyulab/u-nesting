name: Python Package

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/python/**'
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish destination'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Check if version changed
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify binding versions are in lockstep
        run: bash scripts/check-version-consistency.sh

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version is unpublished on PyPI
        id: check
        # Ask the registry, not the diff of the last commit: a multi-commit push
        # whose final commit lacks the version bump skipped a release silently
        # (u-routing 0.2.3), and the two-commit diff this job used to make had the
        # same blind spot. The sibling crates.io and NuGet workflows already
        # decide this way.
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: u-nesting-ci/1.0" "https://pypi.org/pypi/u-nesting/${VERSION}/json")
          if [ "$HTTP" = "200" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "u-nesting ${VERSION} already on PyPI — skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "u-nesting ${VERSION} not on PyPI (HTTP ${HTTP}) — will publish"
          fi

  linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
          manylinux: auto
      # Publish gate: a wheel that builds is not a wheel that imports. Install the
      # freshly built artifact and drive it, so a broken extension fails here
      # rather than on a user's first `pip install`. Restricted to the native
      # target — aarch64 wheels are cross-built in the manylinux container and
      # cannot be executed on this x86_64 runner.
      - name: Wheel smoke test
        if: matrix.target == 'x86_64'
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          retention-days: 1

  windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target == 'x64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
      # Publish gate — see the linux job. Both matrix targets here are native to
      # the runner, so this always runs.
      - name: Wheel smoke test
        shell: bash
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist
          retention-days: 1

  macos:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}-apple-darwin
          args: --release --out dist -m crates/python/Cargo.toml
          sccache: 'true'
      # Publish gate — see the linux job. `macos-latest` runners are arm64, so
      # only the aarch64 wheel is native here; the x86_64 one is cross-built.
      - name: Wheel smoke test
        if: matrix.target == 'aarch64'
        run: |
          pip install --no-index --find-links dist u-nesting
          python scripts/python_wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          retention-days: 1

  # No sdist yet. The original blocker — out-of-tree path dependencies that
  # maturin could not bundle into a self-contained source distribution — no
  # longer applies now that every dependency is declared by registry version.
  # Wheels remain the published artifact until an sdist job is added and its
  # build-from-source path is verified.

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [check-version, linux, windows, macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/u-nesting
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [check-version, linux, windows, macos]
    runs-on: ubuntu-latest
    if: (needs.check-version.outputs.changed == 'true' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/u-nesting
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
