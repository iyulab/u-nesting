name: NuGet Release

on:
  push:
    branches: [main]
    paths:
      - 'bindings/csharp/UNesting/UNesting.csproj'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NuGet.org'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CSPROJ_PATH: bindings/csharp/UNesting/UNesting.csproj
  PACKAGE_NAME: UNesting
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Check if version changed ──
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify binding versions are in lockstep
        run: bash scripts/check-version-consistency.sh

      - name: Read version from csproj
        id: read
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' ${{ env.CSPROJ_PATH }})
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Decide whether to publish
        id: decide
        run: |
          VERSION=${{ steps.read.outputs.version }}
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — will publish"
          else
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/unesting/${VERSION}/unesting.nuspec")
            if [ "$HTTP" = "200" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "UNesting ${VERSION} already on nuget.org — skipping"
            elif [ "$HTTP" = "404" ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "UNesting ${VERSION} not on nuget.org (HTTP ${HTTP}) — will publish"
            else
              echo "::error::the registry answered HTTP ${HTTP}, so it is unknown whether this version is published; re-run once the registry responds"
              exit 1
            fi
          fi

  # ── Build native libraries for each platform ──
  build-native:
    name: Build Native (${{ matrix.rid }})
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            artifact: u_nesting_ffi.dll
          # Not ubuntu-latest: the library links against the build host's glibc,
          # so the image decides the oldest Linux it loads on. 24.04 = glibc 2.39.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            artifact: libu_nesting_ffi.so
          # Built natively on the arm64 image of the same Ubuntu release, so it
          # has the same glibc floor (2.39) as linux-x64.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            artifact: libu_nesting_ffi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            rid: osx-x64
            artifact: libu_nesting_ffi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            artifact: libu_nesting_ffi.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p u-nesting-ffi

      - name: Upload native artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  # ── Pack & Publish NuGet ──
  pack:
    name: Pack NuGet
    needs: [check-version, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # One artifact per build-native leg; the matrix above is the only list of
      # runtimes, so adding one there is all it takes to ship it.
      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native

      - name: Place native libraries by runtime identifier
        run: |
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            mkdir -p "bindings/csharp/UNesting/runtimes/$rid/native"
            mv "$dir"/* "bindings/csharp/UNesting/runtimes/$rid/native/"
          done

      - name: Verify native libraries
        run: |
          echo "=== Native libraries ==="
          find bindings/csharp/UNesting/runtimes -type f -exec ls -lh {} \;
          # Assert, don't just print: every runtime identifier packed into the
          # nupkg must have produced a binary. Listing alone cannot fail, so a
          # missing artifact would reach `dotnet pack` unnoticed.
          for dir in bindings/csharp/UNesting/runtimes/*/native; do
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::$dir holds $count files, expected one native library"
              exit 1
            fi
          done

      - name: Pack NuGet
        run: |
          dotnet pack ${{ env.CSPROJ_PATH }} -c Release -o ./nupkg

      - name: Inspect package
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          echo "=== Package contents ==="
          unzip -l ./nupkg/${{ env.PACKAGE_NAME }}.${VERSION}.nupkg | grep -E "runtimes|build|lib"

      # Restore the package just packed into a new console app and call it: a
      # package that restores but cannot load its native library fails here,
      # not on a consumer's first call.
      - name: NuGet package smoke test
        run: |
          bash scripts/nuget_package_smoke.sh ./nupkg ${{ env.PACKAGE_NAME }} ${{ needs.check-version.outputs.version }} bindings/csharp/package-smoke/Program.cs

      # The packages go to the central publisher (iyulab/nuget-publish): it holds the
      # trusted-publishing policy and the only NuGet credential flow. Only the
      # .nupkg / .snupkg files, and for a day.
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 1

  # Ask the central publisher to push the packages above. This repository holds no
  # NuGet key. The call must not run for a pull request.
  publish:
    name: Publish to NuGet.org (central)
    needs: pack
    if: github.event_name == 'push' || inputs.publish != false
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit

  # The artifacts above only carry files between jobs. Once the package is on
  # NuGet they are storage nobody reads, so they go as soon as it is published.
  # A run that does not publish keeps them for inspection until they expire.
  # This job alone gets `actions: write`.
  cleanup-artifacts:
    name: Delete intermediate artifacts
    needs: publish
    if: github.event_name == 'push' || inputs.publish != false
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            native-*
            nuget-packages
