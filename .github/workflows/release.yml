name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if version unchanged'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Check if version changed
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify binding versions are in lockstep
        run: bash scripts/check-version-consistency.sh

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version is unpublished on crates.io
        id: check
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: u-nesting-ci/1.0" "https://crates.io/api/v1/crates/u-nesting/${VERSION}")
          if [ "$HTTP" = "200" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "u-nesting ${VERSION} already on crates.io — skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "u-nesting ${VERSION} not on crates.io (HTTP ${HTTP}) — will publish"
          fi

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local pkg=$1
            local out
            out=$(cargo publish -p "$pkg" --allow-dirty 2>&1) && { echo "$pkg: published"; return 0; }
            if echo "$out" | grep -q "already uploaded"; then
              echo "$pkg: already on crates.io — skipping"
            else
              echo "::error::$pkg publish failed: $out"
              exit 1
            fi
          }
          publish_crate u-nesting-core
          sleep 30
          publish_crate u-nesting-d2
          sleep 30
          publish_crate u-nesting-d3
          sleep 30
          publish_crate u-nesting-cutting
          sleep 30
          publish_crate u-nesting
          sleep 30
          publish_crate u-nesting-ffi
