name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if version unchanged'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Check if version changed
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify binding versions are in lockstep
        run: bash scripts/check-version-consistency.sh

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(grep -m1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version is unpublished on crates.io
        id: check
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          PUBLISHED=$(curl -sf "https://crates.io/api/v1/crates/u-nesting/versions" \
            -H "User-Agent: u-nesting-ci/1.0" \
            | python3 -c "import sys,json; vs=[v['num'] for v in json.load(sys.stdin).get('versions',[])]; print('true' if '${VERSION}' in vs else 'false')" \
            2>/dev/null || echo "false")
          if [ "$PUBLISHED" = "false" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} not yet on crates.io — will publish"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version ${VERSION} already on crates.io — skipping"
          fi

  # Publish to crates.io
  publish-crates:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone path dependencies
        run: |
          BASE=$(dirname $(dirname $GITHUB_WORKSPACE))
          mkdir -p $BASE/algorithms $BASE/foundation
          git clone --depth 1 https://github.com/iyulab/u-geometry $BASE/algorithms/u-geometry
          git clone --depth 1 https://github.com/iyulab/u-metaheur $BASE/algorithms/u-metaheur
          git clone --depth 1 https://github.com/iyulab/u-numflow $BASE/foundation/u-numflow

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_crate() {
            local pkg=$1
            local out
            out=$(cargo publish -p "$pkg" --allow-dirty 2>&1) && { echo "$pkg: published"; return 0; }
            if echo "$out" | grep -q "already uploaded"; then
              echo "$pkg: already on crates.io — skipping"
            else
              echo "::error::$pkg publish failed: $out"
              exit 1
            fi
          }
          publish_crate u-nesting-core
          sleep 30
          publish_crate u-nesting-d2
          sleep 30
          publish_crate u-nesting-d3
          sleep 30
          publish_crate u-nesting-cutting
          sleep 30
          publish_crate u-nesting
          sleep 30
          publish_crate u-nesting-ffi
