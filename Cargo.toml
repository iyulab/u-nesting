[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/d2",
    "crates/d3",
    "crates/cutting",
    "crates/ffi",
    "crates/u-nesting",
    "crates/benchmark",
    "crates/python",
    "crates/wasm",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
repository = "https://github.com/iyulab/U-Nesting"
description = "Domain-agnostic 2D/3D spatial optimization engine"
# crates.io allows at most 5 keywords — keep this list inheritable.
keywords = ["nesting", "bin-packing", "geometry", "2d", "3d"]
categories = ["algorithms", "mathematics", "science"]
rust-version = "1.82"

[workspace.dependencies]
# Geometry
i_overlay = "1.9"
rstar = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Parallelism
rayon = "1.10"

# Random
rand = "0.9"

# FFI
libc = "0.2"

# Logging
log = "0.4"
tracing = "0.1"

# Optimization solvers
good_lp = { version = "1.10", default-features = false }

# Testing
proptest = "1.5"
approx = "0.5"
criterion = "0.5"

# Python bindings.
# abi3-py38 builds against CPython's stable ABI: one wheel works on Python 3.8+
# (matching pyproject `requires-python >=3.8`) and cross-compiles (e.g. aarch64)
# without a target-arch interpreter — which the version-specific build could not.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }

# WebAssembly bindings
wasm-bindgen = "0.2"

# Internal crates
u-nesting-core = { version = "0.9.0", path = "crates/core" }
u-nesting-d2 = { version = "0.9.0", path = "crates/d2" }
u-nesting-d3 = { version = "0.9.0", path = "crates/d3" }
u-nesting-cutting = { version = "0.9.0", path = "crates/cutting" }
u-nesting-ffi = { version = "0.9.0", path = "crates/ffi" }
u-nesting = { version = "0.3.1", path = "crates/u-nesting" }

# Note: `panic = "abort"` is intentionally NOT set. This crate ships a cdylib
# consumed over C FFI (C#/Python/WASM). Unwinding must reach the FFI boundary so
# `catch_unwind` in the `unesting_solve_*` entry points can convert an internal
# panic into an error response instead of aborting the host process (SIGABRT).
[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1
