[package]
name = "u-nesting-benchmark"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmark suite for U-Nesting using ESICUP datasets"
keywords = ["benchmark", "nesting", "esicup"]
categories = ["development-tools::profiling"]
rust-version.workspace = true
publish = false

[dependencies]
u-nesting-core = { workspace = true, features = ["serde"] }
u-nesting-d2 = { workspace = true, features = ["serde"] }
u-nesting-d3 = { workspace = true, features = ["serde"] }

rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# HTTP client for downloading datasets
ureq = "3.4"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Timing
instant = "0.1"


# TOML serialization for scenarios
toml = "1.1"

# Progress display

[dev-dependencies]

[[bin]]
name = "bench-runner"
path = "src/main.rs"
