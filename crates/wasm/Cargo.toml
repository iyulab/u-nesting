[package]
name = "u-nesting-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for U-Nesting spatial optimization engine"
keywords = ["nesting", "bin-packing", "wasm", "webassembly"]
categories = ["algorithms", "wasm"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
u-nesting-core = { workspace = true, features = ["serde"] }
u-nesting-d2 = { workspace = true, features = ["serde"] }
u-nesting-d3 = { workspace = true, features = ["serde"] }
u-nesting-cutting = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
