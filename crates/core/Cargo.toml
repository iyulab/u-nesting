[package]
name = "u-nesting-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Core traits and abstractions for U-Nesting spatial optimization engine"
keywords = ["nesting", "bin-packing", "optimization", "geometry"]
categories = ["algorithms", "mathematics"]

[dependencies]
serde = { workspace = true, optional = true }
# Request reading (`api_types::from_json`): the path of a refused field.
serde_json = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1", optional = true }
thiserror.workspace = true
rayon = { workspace = true, optional = true }
rand.workspace = true
# Wall-clock timing that works on both native (re-exports std::time) and wasm
# (performance.now()). Restores time_limit_ms termination on wasm.
web-time = "1"
u-metaheur = "0.12"
u-geometry = "0.6"
# TypeScript declarations of the wire types, for the WebAssembly binding.
tsify = { version = "0.5", default-features = false, features = ["js"], optional = true }
# What the `tsify` derive expands to names `wasm_bindgen`.
wasm-bindgen = { workspace = true, optional = true }
[dev-dependencies]
serde_json = "1.0"
approx.workspace = true

[features]
default = []
serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
    "u-geometry/serde",
    "u-metaheur/serde",
]
parallel = ["dep:rayon"]
# TypeScript declarations (`tsify`) of the `api_types` wire types, for the
# WebAssembly binding's `.d.ts`.
tsify = ["serde", "dep:tsify", "dep:wasm-bindgen"]
# Set by `u-nesting-d2/milp`: the exact strategies are offered in 2D only
# when the solver that runs them is built (`Strategy::is_offered`).
milp = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there. `wasm-bindgen`
# is named only by what the `tsify` derive expands to.
[package.metadata.cargo-machete]
ignored = ["getrandom", "wasm-bindgen"]
