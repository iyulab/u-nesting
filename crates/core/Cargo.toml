[package]
name = "u-nesting-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Core traits and abstractions for U-Nesting spatial optimization engine"
keywords = ["nesting", "bin-packing", "optimization", "geometry"]
categories = ["algorithms", "mathematics"]

[dependencies]
serde = { workspace = true, optional = true }
# Request reading (`api_types::from_json`): the path of a refused field.
serde_json = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1", optional = true }
thiserror.workspace = true
rayon = { workspace = true, optional = true }
rand.workspace = true
# Wall-clock timing that works on both native (re-exports std::time) and wasm
# (performance.now()). Restores time_limit_ms termination on wasm.
web-time = "1"
u-metaheur = "0.8"
u-geometry = "0.5"
[dev-dependencies]
serde_json = "1.0"
approx.workspace = true

[features]
default = []
serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
    "u-geometry/serde",
]
parallel = ["dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
